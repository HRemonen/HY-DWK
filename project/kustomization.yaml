apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dwk-project

resources:
- project-backend/manifests/analysistemplate.yaml
- project-backend/manifests/rollout.yaml
- project-backend/manifests/postgres.yaml
- project-backend/manifests/sealed-secret.yaml
- project-backend/manifests/service.yaml
- project-backend/manifests/todocron.yaml
- project-frontend/manifests/deployment.yaml
- project-frontend/manifests/ingress.yaml
- project-frontend/manifests/persistentVolumeClaim.yaml
- project-frontend/manifests/service.yaml
- project-broadcaster/manifests/deployment.yaml

images:
- name: BACKEND_IMAGE
  newName: hremonen/dwkproject-backend
  newTag: 5b2f7affd3ea426088aac0f9f872335030f3588e
- name: BROADCASTER_IMAGE
  newName: hremonen/dwkproject-broadcaster
  newTag: 5b2f7affd3ea426088aac0f9f872335030f3588e
- name: CRONJOB_IMAGE
  newName: hremonen/dwkproject-cron
  newTag: 5b2f7affd3ea426088aac0f9f872335030f3588e
- name: FRONTEND_IMAGE
  newName: hremonen/dwkproject-frontend
  newTag: 5b2f7affd3ea426088aac0f9f872335030f3588e
